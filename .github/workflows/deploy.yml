name: Deploy Hexo Blog

on:
  push:
    branches: [hexo_20250618]
  pull_request:
    branches: [hexo_20250618]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update and verify submodules
      run: |
        echo "=== Initializing submodules ==="
        git submodule update --init --recursive --force
        echo "=== Submodule status ==="
        git submodule status
        echo "=== Checking themes/next directory ==="
        ls -la themes/
        if [ -d "themes/next" ]; then
          echo "themes/next exists, checking contents..."
          ls -la themes/next/ | head -20
          if [ ! -f "themes/next/_config.yml" ]; then
            echo "ERROR: themes/next/_config.yml not found! Theme not loaded properly."
            exit 1
          fi
          echo "Theme loaded successfully!"
        else
          echo "ERROR: themes/next directory not found!"
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Clean and Build
      run: |
        echo "=== Cleaning ==="
        npm run clean
        echo "=== Building with verbose output ==="
        npx hexo generate --debug 2>&1 | tail -100
        
    - name: Verify build output
      run: |
        echo "Checking if public directory exists and has content..."
        ls -la public/
        if [ ! -f "public/index.html" ]; then
          echo "ERROR: index.html not found in public directory!"
          exit 1
        fi
        echo "index.html size: $(wc -c < public/index.html) bytes"
        if [ $(wc -c < public/index.html) -lt 1000 ]; then
          echo "WARNING: index.html seems too small!"
          cat public/index.html
          exit 1
        fi
        echo "Build verification passed!"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/hexo_20250618'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: master
        force_orphan: false
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy: ${{ github.event.head_commit.message }}'
