name: Deploy Hexo Blog

on:
  push:
    branches: [hexo_20250618]
  pull_request:
    branches: [hexo_20250618]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Update and verify submodules
      run: |
        echo "=== Initializing submodules ==="
        git submodule update --init --recursive --force
        echo "=== Submodule status ==="
        git submodule status
        echo "=== Checking themes/next directory ==="
        ls -la themes/
        if [ -d "themes/next" ]; then
          echo "themes/next exists, checking contents..."
          ls -la themes/next/ | head -20
          if [ ! -f "themes/next/_config.yml" ]; then
            echo "ERROR: themes/next/_config.yml not found! Theme not loaded properly."
            exit 1
          fi
          echo "Theme loaded successfully!"
        else
          echo "ERROR: themes/next directory not found!"
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Clean and Build
      run: |
        echo "=== Cleaning ==="
        npm run clean
        echo "=== Building with verbose output ==="
        npx hexo generate --debug
        echo "=== Checking if index.html was generated ==="
        if [ -f "public/index.html" ]; then
          echo "✓ index.html exists"
          echo "Size: $(wc -c < public/index.html) bytes"
          echo "First 50 lines:"
          head -50 public/index.html
        else
          echo "✗ index.html NOT found!"
        fi
        
    - name: Verify build output
      run: |
        echo "Checking if public directory exists and has content..."
        ls -la public/
        echo "=== Checking index.html ==="
        if [ ! -f "public/index.html" ]; then
          echo "ERROR: index.html not found in public directory!"
          echo "Listing all HTML files in public:"
          find public -name "*.html" -type f | head -20
          exit 1
        fi
        FILE_SIZE=$(wc -c < public/index.html)
        echo "index.html size: $FILE_SIZE bytes"
        if [ "$FILE_SIZE" -lt 100 ]; then
          echo "WARNING: index.html seems too small or empty!"
          echo "=== Content of index.html ==="
          cat public/index.html
          echo "=== Checking hexo database ==="
          if [ -f "db.json" ]; then
            echo "db.json exists ($(wc -c < db.json) bytes)"
          fi
          echo "=== Checking _config.yml index_generator ==="
          grep -A 5 "index_generator:" _config.yml
          exit 1
        fi
        echo "✓ Build verification passed! index.html has $FILE_SIZE bytes"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: github.ref == 'refs/heads/hexo_20250618'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: master
        force_orphan: false
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy: ${{ github.event.head_commit.message }}'
